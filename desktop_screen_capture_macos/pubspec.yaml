name: desktop_screen_capture_macos
description: macOS implementation for desktop_screen_capture.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.10.8
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  desktop_screen_capture_platform_interface:
    path: ../desktop_screen_capture_platform_interface

dev_dependencies:
  uni_lints:
    git:
      url: https://github.com/kwikwicommon/uni_lints.git
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    implements: desktop_screen_capture
    platforms:
      macos:
        pluginClass: MacosCapturePlugin
        dartPluginClass: DesktopScreenCaptureMacosPlatform
